const xMin=wl[0],xMax=wl[wl.length-1];
const mx=x=>m.l+(x-xMin)/(xMax-xMin)*pw;
const my=v=>m.t+ph-(v-vMin+pad)/(vMax-vMin+2*pad)*ph;
ctx.fillStyle='#aaa';ctx.font='14px monospace';ctx.fillText(title,m.l,20);
ctx.strokeStyle='#333';ctx.lineWidth=0.5;
const ystep=Math.pow(10,Math.floor(Math.log10((vMax-vMin)||1)));
for(let v=Math.ceil(vMin/ystep)*ystep;v<=vMax;v+=ystep){ctx.beginPath();ctx.moveTo(m.l,my(v));ctx.lineTo(W-m.r,my(v));ctx.stroke();
ctx.fillStyle='#888';ctx.font='10px monospace';ctx.textAlign='right';ctx.fillText(v.toFixed(0),m.l-5,my(v)+4);}
for(let x=400;x<=1000;x+=100){ctx.beginPath();ctx.moveTo(mx(x),m.t);ctx.lineTo(mx(x),H-m.b);ctx.stroke();
ctx.fillStyle='#888';ctx.textAlign='center';ctx.fillText(x+'nm',mx(x),H-m.b+15);}
ctx.strokeStyle='#ff4444';ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(mx(684.5160585774545),m.t);ctx.lineTo(mx(684.5160585774545),H-m.b);ctx.stroke();ctx.setLineDash([]);
datasets.forEach((d,i)=>{ctx.strokeStyle=colors[i];ctx.lineWidth=1.5;ctx.beginPath();
for(let j=0;j<wl.length;j++){j===0?ctx.moveTo(mx(wl[j]),my(d[j])):ctx.lineTo(mx(wl[j]),my(d[j]));}ctx.stroke();});
labels.forEach((l,i)=>{ctx.fillStyle=colors[i];ctx.font='11px monospace';ctx.textAlign='left';ctx.fillText(l,m.l+10+i*180,m.t+15);});
}
plot('c',[dark,lev0,lev15],['Dark','Level 0','Level 15'],['#888','#ff8800','#00d4ff'],'Full Spectra');
plot('d',[diff],['Level 15 - Dark'],['#3fb950'],'Difference (LED signal only)');

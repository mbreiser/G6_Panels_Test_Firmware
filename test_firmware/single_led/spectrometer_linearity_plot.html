<!DOCTYPE html>
<html><head><title>G6 BCM Linearity — Spectrometer Measurement</title>
<style>
body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; margin: 20px; }
h2 { color: #00d4ff; }
canvas { border: 1px solid #444; background: #0d0d1a; display: block; margin: 10px 0; }
.stats { background: #222; padding: 10px; border-radius: 5px; margin: 10px 0; display: inline-block; }
.row { display: flex; gap: 20px; }
</style>
</head><body>
<h2>G6 Panel — BCM Linearity (Ocean Insight Flame X Spectrometer)</h2>
<div class="stats">
<b>PHOTOCAL 16 levels × 3s</b> | Integration: 500ms | Peak: 570.8 nm | 129 readings | T=0.5µs, 4-bit BCM
</div>

<div class="row">
<div>
<h3 style="color:#00d4ff">Intensity Trace (raw counts vs time)</h3>
<canvas id="trace" width="900" height="350"></canvas>
</div>
</div>

<div class="row">
<div>
<h3 style="color:#00d4ff">Linearity (normalized signal vs BCM level)</h3>
<canvas id="linearity" width="500" height="350"></canvas>
</div>
<div>
<h3 style="color:#00d4ff">Per-Level Summary</h3>
<pre id="table" style="font-size:12px; line-height:1.4;"></pre>
</div>
</div>

<script>
const times = [1.0, 1.51, 2.01, 2.51, 3.01, 3.51, 4.02, 4.52, 5.02, 5.53, 6.03, 6.53, 7.03, 7.54, 8.04, 8.54, 9.05, 9.55, 10.05, 10.55, 11.06, 11.56, 12.06, 12.57, 13.07, 13.57, 14.07, 14.58, 15.08, 15.58, 16.08, 16.59, 17.09, 17.59, 18.1, 18.6, 19.11, 19.61, 20.11, 20.61, 21.12, 21.62, 22.12, 22.62, 23.13, 23.63, 24.13, 24.63, 25.13, 25.64, 26.14, 26.64, 27.14, 27.65, 28.15, 28.65, 29.15, 29.66, 30.16, 30.66, 31.16, 31.66, 32.17, 32.67, 33.17, 33.67, 34.18, 34.68, 35.18, 35.68, 36.19, 36.69, 37.19, 37.69, 38.2, 38.7, 39.2, 39.7, 40.21, 40.71, 41.21, 41.71, 42.21, 42.72, 43.22, 43.72, 44.22, 44.73, 45.23, 45.73, 46.23, 46.74, 47.24, 47.74, 48.24, 48.75, 49.25, 49.75, 50.25, 50.75, 51.26, 51.76, 52.26, 52.76, 53.27, 53.77, 54.27, 54.77, 55.28, 55.78, 56.28, 56.78, 57.29, 57.79, 58.29, 58.8, 59.3, 59.81, 60.31, 60.81, 61.32, 61.82, 62.32, 62.82, 63.33, 63.83, 64.33, 64.84, 65.34];
const counts = [4623.7, 4645.4, 4658.2, 4670.7, 4676.1, 4678.4, 4691.0, 4698.8, 4713.6, 4715.4, 4722.1, 4727.4, 4740.7, 4742.5, 4746.2, 4740.6, 4752.1, 4758.7, 4754.8, 4766.2, 4764.9, 4771.2, 4774.3, 4777.4, 4775.2, 4786.2, 4787.1, 4783.6, 4785.6, 4798.4, 4798.3, 4800.6, 4803.9, 4806.6, 4803.0, 4804.8, 4807.8, 4806.1, 4808.8, 4816.7, 4812.5, 4819.2, 4829.9, 4820.8, 4823.4, 4825.1, 4828.2, 4828.3, 4834.0, 4835.3, 4834.8, 4839.4, 4838.5, 4840.0, 4837.2, 4843.1, 4846.1, 4844.0, 4845.3, 4849.7, 4847.9, 4852.3, 4842.9, 4851.1, 4850.5, 4860.0, 4854.1, 4854.2, 4861.4, 4860.8, 4861.4, 4856.0, 4865.4, 4861.7, 4860.6, 4863.9, 4871.5, 4866.9, 4863.1, 4857.6, 4868.1, 4874.8, 4867.2, 4869.1, 4875.3, 4866.6, 4876.9, 4880.0, 4866.7, 4880.7, 4879.8, 4882.6, 4883.6, 4881.1, 4878.3, 4879.7, 4878.1, 4883.5, 4881.5, 4885.7, 4887.8, 4877.4, 4888.2, 4886.6, 4884.8, 4885.4, 4896.4, 4893.6, 4886.1, 4887.1, 4891.1, 4890.5, 4888.6, 4889.1, 4892.5, 4891.2, 4891.6, 4896.3, 4896.8, 4892.0, 4897.8, 4890.6, 4895.4, 4894.6, 4902.5, 4905.7, 4902.9, 4905.4, 4902.8];
const levelAvgs = [{"level": 0, "mean": 4658.099999999999, "std": 12.65029643921447, "n": 3}, {"level": 1, "mean": 4712.475, "std": 9.822889934569506, "n": 4}, {"level": 2, "mean": 4749.4, "std": 7.777317446694872, "n": 4}, {"level": 3, "mean": 4774.525, "std": 2.570829956777823, "n": 4}, {"level": 4, "mean": 4795.725, "std": 6.832947143558558, "n": 4}, {"level": 5, "mean": 4806.875, "std": 1.7764665303160765, "n": 4}, {"level": 6, "mean": 4824.8, "std": 3.832318706301103, "n": 4}, {"level": 7, "mean": 4837.0, "std": 2.290560339014367, "n": 4}, {"level": 8, "mean": 4846.275, "std": 2.441823089414838, "n": 4}, {"level": 9, "mean": 4853.925, "std": 4.345399866525446, "n": 4}, {"level": 10, "mean": 4861.125, "std": 3.8707234465922293, "n": 4}, {"level": 11, "mean": 4863.925, "std": 4.724669300596451, "n": 4}, {"level": 12, "mean": 4874.7, "std": 5.741660619251563, "n": 4}, {"level": 13, "mean": 4881.400000000001, "std": 2.3079572497485827, "n": 4}, {"level": 14, "mean": 4883.1, "std": 4.615192303685908, "n": 4}, {"level": 15, "mean": 4890.375, "std": 5.468927378075719, "n": 4}];
const dark = 4658.099999999999;
const maxSig = 232.27500000000055;

// ── Trace plot ──
const c1 = document.getElementById('trace');
const ctx1 = c1.getContext('2d');
const W1 = c1.width, H1 = c1.height;
const m = {l:60, r:20, t:20, b:40};
const pw = W1-m.l-m.r, ph = H1-m.t-m.b;
const tMin = 0, tMax = Math.max(...times);
const vMin = Math.min(...counts)-20, vMax = Math.max(...counts)+20;

function mapX1(t) { return m.l + (t-tMin)/(tMax-tMin)*pw; }
function mapY1(v) { return m.t + ph - (v-vMin)/(vMax-vMin)*ph; }

// Level backgrounds
for (let i=0; i<16; i++) {
    const x1 = mapX1(i*3.5);
    const x2 = mapX1(i*3.5+3.0);
    ctx1.fillStyle = i%2===0 ? 'rgba(0,100,200,0.08)' : 'rgba(0,200,100,0.08)';
    ctx1.fillRect(x1, m.t, x2-x1, ph);
    ctx1.fillStyle = '#556';
    ctx1.font = '10px monospace';
    ctx1.textAlign = 'center';
    ctx1.fillText(i.toString(), (x1+x2)/2, H1-m.b+12);
}

// Grid
ctx1.strokeStyle = '#333'; ctx1.lineWidth = 0.5;
for (let v=Math.ceil(vMin/50)*50; v<=vMax; v+=50) {
    ctx1.beginPath(); ctx1.moveTo(m.l, mapY1(v)); ctx1.lineTo(W1-m.r, mapY1(v)); ctx1.stroke();
    ctx1.fillStyle='#888'; ctx1.font='11px monospace'; ctx1.textAlign='right';
    ctx1.fillText(v.toFixed(0), m.l-5, mapY1(v)+4);
}

// Data
ctx1.strokeStyle = '#00d4ff'; ctx1.lineWidth = 1.5; ctx1.beginPath();
for (let i=0; i<times.length; i++) {
    const x=mapX1(times[i]), y=mapY1(counts[i]);
    i===0 ? ctx1.moveTo(x,y) : ctx1.lineTo(x,y);
}
ctx1.stroke();

// Dots
ctx1.fillStyle = '#00d4ff';
for (let i=0; i<times.length; i++) {
    ctx1.beginPath();
    ctx1.arc(mapX1(times[i]), mapY1(counts[i]), 2, 0, Math.PI*2);
    ctx1.fill();
}

ctx1.fillStyle='#aaa'; ctx1.font='12px monospace'; ctx1.textAlign='center';
ctx1.fillText('BCM Level', W1/2, H1-5);
ctx1.save(); ctx1.translate(12, H1/2); ctx1.rotate(-Math.PI/2);
ctx1.fillText('Counts (570nm)', 0, 0); ctx1.restore();

// ── Linearity plot ──
const c2 = document.getElementById('linearity');
const ctx2 = c2.getContext('2d');
const W2=c2.width, H2=c2.height;
const m2={l:60,r:20,t:20,b:40};
const pw2=W2-m2.l-m2.r, ph2=H2-m2.t-m2.b;

function mapX2(l) { return m2.l + l/15*pw2; }
function mapY2(v) { return m2.t + ph2 - v*ph2; }

// Grid
ctx2.strokeStyle='#333'; ctx2.lineWidth=0.5;
for (let v=0; v<=1; v+=0.2) {
    ctx2.beginPath(); ctx2.moveTo(m2.l, mapY2(v)); ctx2.lineTo(W2-m2.r, mapY2(v)); ctx2.stroke();
    ctx2.fillStyle='#888'; ctx2.font='11px monospace'; ctx2.textAlign='right';
    ctx2.fillText(v.toFixed(1), m2.l-5, mapY2(v)+4);
}
for (let l=0; l<=15; l+=5) {
    const x=mapX2(l);
    ctx2.beginPath(); ctx2.moveTo(x, m2.t); ctx2.lineTo(x, H2-m2.b); ctx2.stroke();
    ctx2.fillStyle='#888'; ctx2.textAlign='center';
    ctx2.fillText(l.toString(), x, H2-m2.b+15);
}

// Ideal line
ctx2.strokeStyle='#555'; ctx2.lineWidth=1; ctx2.setLineDash([4,4]);
ctx2.beginPath(); ctx2.moveTo(mapX2(0), mapY2(0)); ctx2.lineTo(mapX2(15), mapY2(1)); ctx2.stroke();
ctx2.setLineDash([]);
ctx2.fillStyle='#555'; ctx2.font='10px monospace';
ctx2.fillText('ideal', mapX2(13), mapY2(13/15)-8);

// Measured
ctx2.strokeStyle='#00d4ff'; ctx2.lineWidth=2; ctx2.beginPath();
for (const la of levelAvgs) {
    const norm = maxSig > 0 ? (la.mean - dark) / maxSig : 0;
    const x=mapX2(la.level), y=mapY2(norm);
    la.level===0 ? ctx2.moveTo(x,y) : ctx2.lineTo(x,y);
}
ctx2.stroke();
ctx2.fillStyle='#00d4ff';
for (const la of levelAvgs) {
    const norm = maxSig > 0 ? (la.mean - dark) / maxSig : 0;
    ctx2.beginPath(); ctx2.arc(mapX2(la.level), mapY2(norm), 4, 0, Math.PI*2); ctx2.fill();
}

ctx2.fillStyle='#aaa'; ctx2.font='12px monospace'; ctx2.textAlign='center';
ctx2.fillText('BCM Level', W2/2, H2-5);
ctx2.save(); ctx2.translate(12, H2/2); ctx2.rotate(-Math.PI/2);
ctx2.fillText('Normalized Signal', 0, 0); ctx2.restore();

// ── Table ──
let tbl = 'Level   Mean    Signal   Norm    Ideal  Error\n';
tbl += '─'.repeat(50) + '\n';
for (const la of levelAvgs) {
    const sig = la.mean - dark;
    const norm = maxSig > 0 ? sig/maxSig : 0;
    const ideal = la.level / 15;
    const err = (norm - ideal) * 100;
    tbl += la.level.toString().padStart(3) + '   ' +
           la.mean.toFixed(1).padStart(7) + '   ' +
           sig.toFixed(1).padStart(7) + '   ' +
           norm.toFixed(3).padStart(6) + '   ' +
           ideal.toFixed(3).padStart(6) + ' ' +
           (err>=0?'+':'') + err.toFixed(1).padStart(5) + '%\n';
}
tbl += '\nMonotonic: ' + (levelAvgs.every((la,i) => i===0 || la.mean >= levelAvgs[i-1].mean) ? 'YES' : 'NO');
tbl += '\nDynamic range: ' + maxSig.toFixed(0) + ' counts';
document.getElementById('table').textContent = tbl;
</script>
</body></html>
